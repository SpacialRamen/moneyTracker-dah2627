<!-- Contenido de: src/app/home/home.page.html -->

<!-- La cabecera principal, visible en la parte superior de la pantalla -->
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Lista de Movimientos
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Esta segunda cabecera crea el efecto de título grande que se encoge al hacer scroll -->
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Lista de Movimientos</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Directiva *ngIf: este div solo existirá en el DOM si la condición es verdadera -->
  <div *ngIf="listaDeMovimientos.length === 0" class="mensaje-vacio">
    <p>¡Enhorabuena!</p>
    <p>No tienes movimientos pendientes.</p>
  </div>

  <!-- 
    Directiva *ngFor: este es el bucle. 
    - Por cada objeto 'movimiento' que haya en el array 'listaDeMovimientos'...
    - ...Angular creará una instancia de nuestro componente <app-movimiento-nuevo>.
  -->
  <movimiento-nuevo
    *ngFor="let movimiento of listaDeMovimientos"
    [movimiento]="movimiento"> <!-- Property Binding: le pasamos el objeto 'movimiento' actual al @Input del componente hijo -->
  </movimiento-nuevo>
</ion-content>
