<ion-card>
  <ion-item>
    <input
      type="checkbox"
      [checked]="movimiento.pagado"
      aria-label="Marcar movimiento como pagado"
      class="movimiento-checkbox">

    <ion-label [class.tachado]="movimiento.pagado">
      {{ movimiento.titulo }}
    </ion-label>

    <ion-button (click)="mostrarDetalles()" slot="end">
      Ver
    </ion-button>
  </ion-item>
</ion-card>
